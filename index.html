|<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffc1df, #d9c2ff);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .tarjeta {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 5px 20px #b77acb;
        }

        h1 {
            color: #e754a1;
            font-size: 35px;
        }

        h2 {
            color: #9164d8;
        }

        p {
            color: #777;
            font-size: 18px;
        }

        button {
            background-color: #ff80bd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #c77dff;
        }
    </style>
</head>

<body>

    <div class="tarjeta">
        <h1>¡Hola mundo! 🌎</h1>

        <h2>Soy andi perez kauaionichan 💗</h2>

        <p>Bienvenidos a mi primera página web ✨</p>

        <button onclick="alert('¡Gracias por visitar mi página! 💕')">
            ¡Haz clic aquí!
        </button>
    </div>

</body>
</html>
